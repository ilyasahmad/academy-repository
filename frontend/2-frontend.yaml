# Path: ~/academy-project/frontend/2-frontend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: academy-frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: academy-frontend
  template:
    metadata:
      labels:
        app: academy-frontend
    spec:
      containers:
        - name: frontend
          image: academy-frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30088
  selector:
    app: academy-frontend
